replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

command: []
args: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  extraPorts: []
  # - name: metrics
  #   port: 9113
  #   targetPort: 9113

env: []
# - name: TABLE_NAME
#   value: expenses

envFrom: []

resources: {}

serviceAccount:
  create: false
  name: ""
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::...:role/...   (IRSA)

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraVolumes: []
extraVolumeMounts: []
extraContainers: []
# - name: nginx-exporter
#   image: nginx/nginx-prometheus-exporter:1.1.0
#   args: ["-nginx.scrape-uri=http://localhost/stub_status"]
#   ports:
#     - name: metrics
#       containerPort: 9113

configmap:
  enabled: false
  data: {}

serviceMonitor:
  enabled: false
  port: http
  path: /metrics
  interval: 30s
  labels: {}
  # release: prometheus   # add if your kube-prometheus-stack's serviceMonitorSelector requires this

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix

nameOverride: ""
fullnameOverride: ""
